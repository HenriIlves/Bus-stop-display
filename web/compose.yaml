services:
  bus:
    build: .
    image: bus-stop-web:latest
    container_name: bus
    restart: unless-stopped
    ports:
      - 127.0.0.1:8090:8000
    env_file:
      - .env
    environment:
      TZ: Europe/Helsinki
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    networks:
      - default
      - homepage

networks:
  homepage:
    name: homepage_default
    external: true
